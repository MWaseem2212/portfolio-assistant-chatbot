name: portfolio-assistant-chatbot

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: portfolio-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped