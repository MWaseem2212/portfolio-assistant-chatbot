[project]
name = "portfolio-assistant-chatbot"
version = "0.0.1"
description = "Production-grade Agentic RAG chatbot for my portfolio"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
